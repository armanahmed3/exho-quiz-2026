<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <!-- Add your tab logo here -->
  <link rel="icon" type="image/png" href="../assets/img/logo.png?v=1">
  <title>Dashboard Overview | The Times School Network</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../../assets/js/config/tailwind.config.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
  <link rel="stylesheet" href="../../assets/css/app.css" />
  <!-- Admin guard: must run before the page renders -->
  <script src="../../assets/js/config/constants.js"></script>
  <script src="../../assets/js/core/auth.js"></script>
  <script>Auth.requireAdmin();</script>
</head>
<body class="admin-body font-sans text-slate-800" data-base="../../" data-admin-page="dashboard">

  <div id="page-content" data-title="Dashboard Overview" data-subtitle="Live numbers from the Firebase quiz database">
    <div id="dataError" class="hidden" role="alert"></div>

    <section id="statGrid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-3 sm:gap-4" aria-label="Key numbers"></section>

    <section class="space-y-4">
      <h2 class="font-display text-base sm:text-lg font-bold text-brandBlue flex items-center gap-2 border-b border-slate-200 pb-2"><i class="fa-solid fa-chart-pie text-brandBlueLight"></i> Visual Analytics</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4 sm:gap-6">
        <div class="glass-card p-4 sm:p-5 rounded-2xl space-y-3">
          <div class="flex items-center justify-between"><h3 class="font-display text-xs font-bold text-brandBlue">Top Teachers</h3><i class="fa-solid fa-chalkboard-user text-brandBlueLight"></i></div>
          <div class="h-56 relative flex items-center justify-center"><canvas id="top5TeachersChart"></canvas></div>
        </div>
        <div class="glass-card p-4 sm:p-5 rounded-2xl space-y-3">
          <div class="flex items-center justify-between"><h3 class="font-display text-xs font-bold text-brandBlue">Top Sirs</h3><i class="fa-solid fa-user-tie text-brandBlueLight"></i></div>
          <div class="h-56 relative flex items-center justify-center"><canvas id="top5SirsChart"></canvas></div>
        </div>
        <div class="glass-card p-4 sm:p-5 rounded-2xl space-y-3">
          <div class="flex items-center justify-between"><h3 class="font-display text-xs font-bold text-brandBlue">Top Students (8+)</h3><i class="fa-solid fa-award text-amber-500"></i></div>
          <div class="h-56 relative flex items-center justify-center"><canvas id="topStudentsCircleChart"></canvas>
          <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none pb-4">
            <span id="centerTopStudents" class="text-2xl font-display font-black text-brandBlue">0</span>
            <span class="text-[9px] uppercase font-bold text-slate-400">Top Students</span>
          </div></div>
        </div>
        <div class="glass-card p-4 sm:p-5 rounded-2xl space-y-3">
          <div class="flex items-center justify-between"><h3 class="font-display text-xs font-bold text-brandBlue">Total Attempts</h3><i class="fa-solid fa-circle-play text-emerald-500"></i></div>
          <div class="h-56 relative flex items-center justify-center"><canvas id="totalAttemptsCircleChart"></canvas>
          <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none pb-4">
            <span id="centerTotalAttempts" class="text-2xl font-display font-black text-brandBlue">0</span>
            <span class="text-[9px] uppercase font-bold text-slate-400">Attempts</span>
          </div></div>
        </div>
      </div>
      <p class="text-xs text-slate-500">Want bigger charts? <a href="analytics.html" class="text-brandBlue font-bold hover:underline">Open Analytics &amp; Charts</a></p>
    </section>

    <section class="glass-card p-4 sm:p-6 rounded-2xl space-y-4">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 sm:gap-3 border-b border-slate-200 pb-2">
        <h2 class="font-display text-base sm:text-lg font-bold text-brandBlue flex items-center gap-2"><i class="fa-solid fa-clock-rotate-left"></i> Latest Submissions</h2>
        <a href="leaderboard.html" class="text-xs font-bold text-brandBlue hover:underline">View full leaderboard &rarr;</a>
      </div>
      <div class="table-wrap"><table class="data-table">
        <thead><tr><th>Student</th><th>Class</th><th>Subject</th><th>Marks</th><th>Voted Teacher</th><th>Voted Sir</th><th>Time</th></tr></thead>
        <tbody id="latestBody"></tbody>
      </table></div>
    </section>
  </div>

  <script src="../../assets/js/core/utils.js"></script>
  <script src="../../assets/js/core/validators.js"></script>
  <script src="../../assets/js/core/form-kit.js"></script>
  <script src="../../assets/js/firebase.js"></script>
  <script src="../../assets/js/admin/admin-layout.js"></script>
  <script src="../../assets/js/admin/admin-data.js"></script>
  <script src="../../assets/js/admin/charts.js"></script>
  <script src="../../assets/js/admin/dashboard.js"></script>
</body>
</html>
