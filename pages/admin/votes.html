<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <!-- Add your tab logo here -->
  <link rel="icon" type="image/png" href="../../assets/img/logo.png?v=1">
  <title>Voting Results - Admin Panel | The Times School Network</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../../assets/js/config/tailwind.config.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <link rel="stylesheet" href="../../assets/css/app.css" />
  <!-- Admin guard: must run before the page renders -->
  <script src="../../assets/js/config/constants.js"></script>
  <script src="../../assets/js/core/auth.js"></script>
  <script>Auth.requireAdmin();</script>
</head>
<body class="admin-body font-sans text-slate-800" data-base="../../" data-admin-page="votes">

  <div id="page-content" data-title="Voting Results" data-subtitle="Teacher and Sir appreciation votes, ranked">
    <div id="dataError" class="hidden" role="alert"></div>

    <section id="voteStats" class="grid grid-cols-1 sm:grid-cols-3 gap-3 sm:gap-4"></section>
    <section class="grid grid-cols-1 lg:grid-cols-2 gap-4 sm:gap-6">
      <div class="glass-card p-4 sm:p-6 rounded-2xl space-y-4">
        <h2 class="font-display text-base font-bold text-brandBlue flex items-center gap-2 border-b border-slate-200 pb-2"><i class="fa-solid fa-chalkboard-user"></i> Teachers Voting Stats (Ranked by Votes)</h2>
        <div id="adminTeacherBars" class="space-y-3 pt-1"></div>
      </div>
      <div class="glass-card p-4 sm:p-6 rounded-2xl space-y-4">
        <h2 class="font-display text-base font-bold text-brandBlue flex items-center gap-2 border-b border-slate-200 pb-2"><i class="fa-solid fa-user-tie"></i> Sir Voting Stats (Ranked by Votes)</h2>
        <div id="adminSirBars" class="space-y-3 pt-1"></div>
      </div>
    </section>
  </div>

  <script src="../../assets/js/core/utils.js"></script>
  <script src="../../assets/js/core/validators.js"></script>
  <script src="../../assets/js/core/form-kit.js"></script>
  <script src="../../assets/js/firebase.js"></script>
  <script src="../../assets/js/admin/admin-layout.js"></script>
  <script src="../../assets/js/admin/admin-data.js"></script>
  <script src="../../assets/js/admin/votes.js"></script>
</body>
</html>
