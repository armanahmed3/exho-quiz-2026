<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Add your tab logo here -->
  <link rel="icon" type="image/png" href="../assets/img/logo.png?v=1">
  <title>Sign Up - The Times School Network Exhibition 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../assets/js/config/tailwind.config.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="../assets/css/app.css" />
</head>
<body class="bg-slate-50 text-brandBlue font-sans min-h-screen flex flex-col justify-between selection:bg-brandBlue selection:text-white" data-base="../" data-page="signup">

  <div id="site-navbar"></div>

  <main class="container mx-auto px-3 sm:px-4 pt-24 sm:pt-28 pb-10 sm:pb-12 flex-grow max-w-lg flex items-center justify-center">
    <div class="glass-card enter rounded-2xl p-5 sm:p-6 md:p-8 w-full space-y-5 sm:space-y-6">
      <div class="text-center space-y-2">
        <div class="inline-flex p-3 rounded-full bg-blue-50 text-brandBlue border border-blue-200 text-2xl mb-1"><i class="fa-solid fa-user-plus"></i></div>
        <h1 class="font-display text-2xl md:text-3xl font-extrabold text-brandBlue">Create New Account</h1>
        <p class="text-slate-500 text-xs">Fill out the form below to register your account.</p>
      </div>

      <div id="formBanner" class="hidden" role="status" aria-live="polite"></div>

      <form id="signupForm" novalidate class="space-y-4" autocomplete="on">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div data-field>
            <label class="label" for="firstName">First Name *</label>
            <input class="input" type="text" id="firstName" name="firstName" data-rule="personName" minlength="2" maxlength="30" autocomplete="given-name" placeholder="John" required>
          </div>
          <div data-field>
            <label class="label" for="lastName">Last Name *</label>
            <input class="input" type="text" id="lastName" name="lastName" data-rule="personName" minlength="2" maxlength="30" autocomplete="family-name" placeholder="Doe" required>
          </div>
        </div>

        <div data-field>
          <label class="label" for="username">Username *</label>
          <input class="input" type="text" id="username" name="username" data-rule="username" minlength="6" maxlength="20" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="johndoe123" required>
          <p class="hint"><i class="fa-solid fa-circle-info mr-1"></i>6-20 characters, letters &amp; numbers only.</p>
        </div>

        <div data-field>
          <label class="label" for="email">Email *</label>
          <input class="input" type="email" id="email" name="email" data-rule="email" maxlength="60" autocomplete="email" autocapitalize="none" spellcheck="false" placeholder="example@gmail.com" required>
          <p class="hint"><i class="fa-solid fa-circle-info mr-1"></i>Must end with <strong>@gmail.com</strong>.</p>
        </div>

        <div data-field>
          <label class="label" for="password">Password *</label>
          <div class="relative">
            <input class="input pr-11" type="password" id="password" name="password" data-rule="password" minlength="8" maxlength="64" autocomplete="new-password" placeholder="........" required>
            <button type="button" data-toggle-password="password" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-brandBlue" aria-label="Show or hide password"><i class="fa-solid fa-eye"></i></button>
          </div>
          <p class="hint"><i class="fa-solid fa-circle-info mr-1"></i>8-64 characters, at least one letter and one number, no spaces.</p>
        </div>

        <div data-field>
          <label class="label" for="confirmPassword">Confirm Password *</label>
          <input class="input" type="password" id="confirmPassword" name="confirm" data-rule="confirm" maxlength="64" autocomplete="new-password" placeholder="........" required>
        </div>

        <button type="submit" id="signupBtn" class="btn-primary w-full"><i class="fa-solid fa-user-check"></i><span>Create Account</span></button>
      </form>

      <div class="text-center text-xs text-slate-500 pt-2 border-t border-slate-200">
        Already have an account? <a href="login.html" class="text-brandBlue font-bold hover:underline">Log in here</a>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="../assets/js/config/constants.js"></script>
  <script src="../assets/js/core/utils.js"></script>
  <script src="../assets/js/core/validators.js"></script>
  <script src="../assets/js/core/form-kit.js"></script>
  <script src="../assets/js/firebase.js"></script>
  <script src="../assets/js/core/auth.js"></script>
  <script src="../assets/js/core/layout.js"></script>
  <script src="../assets/js/pages/signup.js"></script>
</body>
</html>
